<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪涝风险控制台</title><style>
:root{--bg:#071321;--card:#0e2238;--line:#23415d;--ink:#eaf4ff;--muted:#a5bdd2;--blue:#42a5ff;--ok:#4dd6a0;--warn:#ffbf5b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#12345b,var(--bg) 55%);color:var(--ink);font:15px "Microsoft YaHei UI",sans-serif;min-height:100vh}.wrap{max-width:1120px;margin:auto;padding:38px 22px}h1{margin:0;font-size:30px}header p,.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#0d2035dd;border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:0 18px 40px #0004}h2{margin:0 0 18px;font-size:19px}.status{display:flex;gap:10px;align-items:center;padding:12px;border-radius:10px;background:#081827;color:var(--muted);margin:18px 0}.dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}.dot.ok{background:var(--ok)}label{display:block;color:var(--muted);font-size:13px;margin:12px 0 5px}input,select{width:100%;border:1px solid var(--line);border-radius:8px;background:#071522;color:var(--ink);padding:10px}button{margin-top:18px;border:0;border-radius:9px;background:linear-gradient(135deg,#2586e8,#42a5ff);color:white;font-weight:bold;padding:11px 18px;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.wide{grid-column:1/-1}pre{height:220px;overflow:auto;margin:0;background:#06111d;border:1px solid #1a344c;border-radius:10px;padding:14px;color:#bfe5ff;font:12px Consolas,monospace;white-space:pre-wrap}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style></head><body><main class="wrap"><header><h1>洪涝风险预测控制台</h1><p>本机运行 · 视频预警 · 深度学习训练 · 公安应急处置辅助</p></header><div class="status"><i class="dot" id="dot"></i><span id="status">正在检测运行环境…</span></div><section class="grid"><article class="card"><h2>视频风险分析</h2><label>本地视频完整路径</label><input id="video" placeholder="C:\\data\\road.mp4"><label>分割方式</label><select id="backend"><option value="unet">U-Net（训练权重）</option><option value="hsv">HSV（传统兜底）</option></select><label>降雨强度（mm/h）</label><input id="rain" value="25" type="number" min="0"><button onclick="analyze()">开始风险分析</button></article><article class="card"><h2>模型训练</h2><label>训练任务</label><select id="task" onchange="taskHint()"><option value="seg">积水区域分割（U-Net）</option><option value="lstm">积水趋势预测（LSTM）</option><option value="fusion">风险等级融合（MLP）</option></select><label>训练设备</label><select id="device"><option value="auto">自动选择（推荐）</option><option value="cpu">仅使用 CPU</option><option value="cuda">使用 NVIDIA CUDA</option></select><label id="dataLabel">图像目录（分割）</label><input id="data1" placeholder="C:\\data\\images"><label id="dataLabel2">掩码目录（分割）</label><input id="data2" placeholder="C:\\data\\masks"><div class="grid"><div><label>轮数</label><input id="epochs" value="30" type="number" min="1"></div><div><label>批大小</label><input id="batch" value="8" type="number" min="1"></div></div><button onclick="train()">开始模型训练</button></article><article class="card wide"><h2>实时运行日志</h2><pre id="log">等待任务启动…</pre></article></section></main><script>
const $=id=>document.getElementById(id);async function api(url,data){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)alert(j.error||'操作失败');else $('log').textContent+='\n'+j.message}function taskHint(){let t=$('task').value,one=$('data1'),two=$('data2');if(t==='seg'){$('dataLabel').textContent='图像目录（分割）';$('dataLabel2').textContent='掩码目录（分割）';one.placeholder='C:\\data\\images';two.style.display='block';$('dataLabel2').style.display='block'}else{$('dataLabel').textContent=t==='lstm'?'时序 CSV（需 ratio 列）':'融合 CSV（需特征列）';one.placeholder='C:\\data\\series.csv';two.style.display='none';$('dataLabel2').style.display='none'}}async function analyze(){api('/api/analyze',{video:$('video').value,backend:$('backend').value,rain:$('rain').value})}async function train(){let t=$('task').value,d={task:t,device:$('device').value,epochs:$('epochs').value,batch_size:$('batch').value,lr:.0001,val_split:.2};if(t==='seg'){d.image_dir=$('data1').value;d.mask_dir=$('data2').value}else d.csv=$('data1').value;api('/api/train',d)}async function refresh(){let s=await fetch('/api/status').then(r=>r.json()),c=s.cuda,text=c.available?`CUDA 已启用：${c.device} · PyTorch ${c.torch}`:`CPU 模式 · PyTorch ${c.torch||'未检测到'}${c.cuda?' · CUDA '+c.cuda:''}`;$('status').textContent=(s.running?'任务运行中 · ':'')+text;$('dot').className='dot '+(c.available?'ok':'');if(s.logs.length)$('log').textContent=s.logs.join('\n')}taskHint();refresh();setInterval(refresh,1500);
</script></body></html>
